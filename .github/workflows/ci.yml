name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe -d cafe_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cafe:cafe@localhost:5432/cafe_teste
      DATABASE_TEST_URL: postgresql+psycopg://cafe:cafe@localhost:5432/cafe_teste
    steps:
      - name: Obter o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verificar estilo e erros
        run: ruff check .
      - name: Aplicar migrations no banco de teste
        run: alembic upgrade head
      - name: Executar testes e verificar cobertura
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Auditar dependências da aplicação
        run: pip-audit -r requirements.txt
